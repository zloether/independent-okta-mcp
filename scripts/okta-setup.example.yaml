# Config for scripts/okta-setup.py. Copy, edit, then:
#   uv run python scripts/okta-setup.py check --config okta-setup.yaml
# Unknown keys are rejected. See docs/okta-setup.md.

# Canonical external URL of the MCP endpoint (MCP_PUBLIC_URL); becomes the AS audience.
mcp_public_url: https://mcp.example.com/mcp

# Optional; defaults shown.
authorization_server: okta-mcp
scope: okta-mcp
access_token_minutes: 30 # 5–30

# Option B: rotating refresh tokens, so users stay signed in until the session goes idle or
# ends. Omit for option A (the default): no refresh tokens; users sign in again when the access
# token expires. See "Refresh tokens: option A or B" in docs/okta-setup.md.
# refresh_tokens:
#   idle_minutes: 60 # ≥ access_token_minutes, ≤ lifetime_minutes
#   lifetime_minutes: 480 # ≤ 1440

# Role group names start with this (optional; default shown). The groups claim emits the IDs of
# Okta groups whose name starts with it. 4-64 characters: letters, digits, space, _ . : -
group_prefix: mcp-okta-

# Role groups, each named with group_prefix; their IDs go into policy.yaml.
groups:
  - mcp-okta-helpdesk
  - mcp-okta-readers

# Only for a group above that has members before the tool has put it in the policy rule (one
# that existed before the first run): `check` reports it as manual, with its ID, until you
# have looked at its members and listed the ID here. Anyone in a role group gets the role.
# Remove the entry once `check` is clean.
# reviewed_groups:
#   - 00g1helpdsk000000000

# One public (PKCE) OIDC app per approved MCP client, with its exact redirect URIs.
clients:
  - name: Example MCP Client
    redirect_uris:
      - http://127.0.0.1:8765/callback

# The server's own Okta credential.
service_app:
  name: okta-mcp service
  public_key_file: okta-mcp-service.pub.pem # relative to this file
  scopes: # okta.*.read only; this is the server's capability ceiling
    - okta.users.read
    - okta.groups.read
