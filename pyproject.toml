[project]
name = "independent-okta-mcp"
version = "0.0.0"
description = "Independent, read-only MCP server for the Okta Management API with group-based tool policy. Not affiliated with or endorsed by Okta."
readme = "README.md"
# Apache-2.0 with the Commons Clause: not on the SPDX list, so a LicenseRef. LICENSE holds the
# terms; NOTICE the vendored Okta spec's attribution. Both ship in the wheel and sdist.
license = "LicenseRef-Commons-Clause-Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
keywords = ["mcp", "okta", "model-context-protocol", "identity", "read-only"]
# No `License ::` classifier: Apache-2.0 with the Commons Clause isn't OSI-approved.
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
]
dependencies = [
    "anyio>=4.6",
    "httpx2>=2.16",
    "jsonschema>=4.23",
    "mcp==2.3.0",
    "pydantic>=2.10",
    "pyjwt[crypto]>=2.10",
    "pyyaml>=6.0.2",
    "starlette>=0.48",
    "uvicorn>=0.34",
]

[project.urls]
Homepage = "https://github.com/zloether/independent-okta-mcp"
Source = "https://github.com/zloether/independent-okta-mcp"
Documentation = "https://github.com/zloether/independent-okta-mcp/tree/main/docs"
Issues = "https://github.com/zloether/independent-okta-mcp/issues"
Changelog = "https://github.com/zloether/independent-okta-mcp/blob/main/CHANGELOG.md"

[project.scripts]
okta-mcp = "okta_mcp.__main__:main"

[dependency-groups]
dev = [
    "pip-audit>=2.8",
    "pyright>=1.1.400",
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

# The import package keeps its name; uv_build would otherwise derive `independent_okta_mcp`.
[tool.uv.build-backend]
module-name = "okta_mcp"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Runs the docker CLI on fixed arguments.
"tests/container/**" = ["S101", "S603", "S607"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Shared helpers (`_samples`, `policy._pilot`) import from here whatever the import mode.
pythonpath = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
xfail_strict = true
