# Secret field paths replaced with "[redacted]" in every result, whatever the caller's role
# (design §9.2). Defence in depth: commands that return secrets are classified
# `credential-material` as well.
#
# A path is a dotted chain of object keys. It matches wherever that chain appears in a result,
# at any depth (inside `_embedded`, inside arrays), and keys compare case-insensitively. So a
# single key such as `privateKey` matches that key everywhere. No wildcards.
#
# `paths` are redacted whatever the value. `strings` are redacted only when the value is a
# string: for keys that hold a secret as a string but name config objects elsewhere.
#
# Add a path when a "normal" endpoint is found to return a secret (V14). Each path is tested
# on its own in tests/exec/test_output.py.
paths:
  # Named in design §9.2.
  - protocol.credentials.client.client_secret  # identity-providers list/get
  - delivery.authorization_header              # security get-ssf-streams
  - credentials.oauthClient.client_secret      # apps, groups get-apps (spec: create/update only)
  # Secret-valued keys from the pinned spec's schemas.
  - client_secret
  - clientSecret
  - secret_hash
  - privateKey
  - secret
  - sharedSecret
  - secretKey
  - secretValue
  - device_secret
  - credentials.password.value
  - credentials.password.hash
  - activationToken
  - recoveryToken
  - sessionToken
  - SSWSToken
  - providerAuthToken
  - access_token
  - id_token
  - adminPassword                              # Office 365 provisioning connection settings
  - tokenEncrypted                             # Org2Org app settings.app
  - apiKey                                     # Persona IdP protocol.credentials.bearer
  # Event and inline hook headers are `{key, value}` pairs; any of them may carry a credential.
  - channel.config.headers.value
strings:
  # Objects elsewhere: password policy `settings.password`, OIDC app
  # `settings.oauthClient.refresh_token` rotation settings, `{jti}` in token hook events.
  - password                                   # SMTP servers, app service accounts
  - token                                      # Org2Org app settings.app, app tokens
  - refresh_token                              # token-endpoint responses
