# Coverage catalogue (design §5.6, plan step 1.5).
#
# The okta-skills command set, minus ai-agents (out of v1) and terraform (not an API domain),
# at okta-skills commit d6c8725945a51843d7ccff43b526b98594410c3e. Command names and the gotcha
# notes are derived from okta-skills (Apache-2.0 + Commons Clause); the data was extracted once
# by a script run outside this repo, then kinds, items_key, gotchas and exclusions were set by
# hand and checked against the pinned spec. Nothing here is loaded by the server;
# scripts/coverage-report.py reads it.
#
# kind:      simple | resolved | composite | excluded (design §5.6)
# paginate:  link | body_links | link_or_body | none, from the pinned spec (`after`, `_links.next`)
# items_key: the list inside a wrapped response
# gotcha:    spec and live API differ, or the endpoint is otherwise tricky; record a fixture
# reason:    why an excluded command can never be served

