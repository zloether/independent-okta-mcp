version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      minor-and-patch:
        update-types: [minor, patch]
        # Its own PR: `app._gate_endpoint` depends on SDK internals and refuses to build when
        # they change, so an mcp bump must be bisectable from the rest.
        exclude-patterns: [mcp]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Dockerfile base and uv image digests. A Python minor (3.12 -> 3.13) is a deliberate change
  # with CI's matrix, not a digest bump; a uv bump must also move setup-uv in ci.yml.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
