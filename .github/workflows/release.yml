# Release pipeline (plan 8.3.2, design §11.5). Runs on a pushed `v*` tag, nothing else.
#
# verify -> build + image-build (amd64, arm64) -> image (approve) -> image-test (amd64, arm64)
#   -> pypi (approve) -> github-release
#
# - `verify` (scripts/release-verify.py) refuses anything but an annotated, SSH-signed tag
#   from a key in main's .github/allowed_signers, on a commit of main, matching pyproject's
#   version. It is a guard against mistakes: this file runs as it is in the tagged commit, so
#   the hard gates are the tag ruleset (only the maintainer creates v* tags) and the `release`
#   environment's required reviewer, who sees the run's commit before approving.
# - Everything that can publish or sign runs in the `release` environment (deployment: v*
#   tags only, required reviewer). No stored token: GHCR uses the job token, PyPI Trusted
#   Publishing (OIDC), attestations the job's OIDC identity.
# - Built once: the sdist and wheel in `build`; the image in `image-build`, one job per platform
#   on a native runner, with no write permission. `image` (approved) pushes both as one index;
#   `image-test` pulls that digest on each platform. rcN tags go to TestPyPI and a GHCR rc tag;
#   finals to PyPI.
# - Fetches from origin without credentials, so it needs the repository to be public
#   (if it isn't, `verify` fails, closed).
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

# One release at a time. GitHub keeps one pending run per group and cancels an older pending
# one, so push the next tag only after the last run has ended (docs/releasing.md).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      # main's copy of the script and the signers file, not the tag's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Full history: the script checks the tagged commit is an ancestor of main's tip.
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: python3 -I scripts/release-verify.py "$TAG" --fetch --sha "$GITHUB_SHA"

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.12"
      # The wheel is built from the sdist, as an installer from source would.
      - run: uv build --out-dir dist
      # The hashed lock (hashes are uv's default): `pip install --require-hashes -r
      # requirements.lock` and then the wheel installs exactly what CI tested.
      - run: uv export --frozen --no-dev --no-emit-project --format requirements-txt -o lock/requirements.lock
      # Flat names, as the release assets are: `sha256sum -c SHA256SUMS` beside them.
      - run: (cd dist && sha256sum -- *) > lock/SHA256SUMS && (cd lock && sha256sum requirements.lock) >> lock/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lock
          path: lock/
          if-no-files-found: error

  image-build:
    # One job per platform on a native runner (plan 8.4.1): an emulated arm64 build isn't the
    # arm64 runtime that ships, and under QEMU the image tests time out. No write permission:
    # each job exports an OCI layout (image, SBOM and BuildKit provenance) as an artifact, and
    # only `image`, after approval, pushes anything.
    needs: verify
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            artifact: image-linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: image-linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # docker-container driver: the default driver can't export SBOM and provenance attestations.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/image,tar=false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          # In the layout's per-platform index; `image` carries them into the release index.
          sbom: true
          provenance: mode=max
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/image/
          if-no-files-found: error
          # Outlasts the wait for `image`'s approval, whatever the repository default.
          retention-days: 30

  image:
    # `build` too: a release whose dists fail must not push an image (its version is then spent).
    needs: [verify, build, image-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-linux-*
          path: ${{ runner.temp }}/images
      - name: Log in to GHCR
        env:
          TOKEN: ${{ github.token }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      # Each layout must hold one image of its own platform; the index pushed must hold exactly
      # both. The SBOM and provenance manifests (platform unknown/unknown) travel with them.
      - name: Push the index
        id: push
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ needs.verify.outputs.version }}
          DIR: ${{ runner.temp }}/images
        run: |
          set -euo pipefail
          platforms() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -c '[.manifests[]
              | select(.annotations["vnd.docker.reference.type"] != "attestation-manifest")
              | "\(.platform.os)/\(.platform.architecture)"] | sort'
          }
          sources=()
          for platform in linux/amd64 linux/arm64; do
            layout="$DIR/image-${platform//\//-}"
            digest=$(jq -er '.manifests | if length == 1 then .[0].digest else error("not one image") end' "$layout/index.json")
            got=$(platforms "oci-layout://$layout@$digest")
            test "$got" = "[\"$platform\"]" || { echo "$layout holds $got, not $platform" >&2; exit 1; }
            sources+=("oci-layout://$layout@$digest")
          done
          docker buildx imagetools create --tag "$IMAGE" --metadata-file "$RUNNER_TEMP/index.json" "${sources[@]}"
          digest=$(jq -er '."containerimage.descriptor".digest' "$RUNNER_TEMP/index.json")
          got=$(platforms "$IMAGE@$digest")
          test "$got" = '["linux/amd64","linux/arm64"]' || { echo "index holds $got" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # The index digest: what the release notes print and operators pin.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - if: always()
        run: docker logout ghcr.io

  image-test:
    # The image as an operator pulls it, by digest, with the checks CI runs on its own build, on
    # each platform's native runner: an untested arm64 image doesn't ship.
    needs: [verify, image]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            machine: x86_64
          - runner: ubuntu-24.04-arm
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      attestations: read
    env:
      IMAGE: ghcr.io/${{ github.repository }}@${{ needs.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.12"
      - name: Pull the image
        env:
          TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$IMAGE"
      # The runner's own platform from the index, run natively, not emulated.
      - name: Check the platform
        env:
          MACHINE: ${{ matrix.machine }}
        run: test "$(docker run --rm --entrypoint python "$IMAGE" -c 'import platform; print(platform.machine())')" = "$MACHINE"
      # `--repo` alone would accept an attestation made by any workflow on any branch here.
      # Still logged in: gh reads the image from GHCR with Docker's credentials, and a new
      # package is private until the maintainer makes it public.
      - name: Verify the image attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify "oci://$IMAGE" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-ref "$GITHUB_REF" --deny-self-hosted-runners
      - if: always()
        run: docker logout ghcr.io
      - run: uv sync --frozen
      - run: uv run pytest tests/container
        env:
          OKTA_MCP_IMAGE: ${{ env.IMAGE }}
      # As in ci.yml: Trivy by digest, reading a saved tarball, not the Docker socket.
      - name: Scan image
        run: |
          docker save "$IMAGE" -o "$RUNNER_TEMP/image.tar"
          docker run --rm -v "$RUNNER_TEMP/image.tar:/image.tar:ro" \
            aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 \
            image --input /image.tar --scanners vuln --ignore-unfixed \
            --severity HIGH,CRITICAL --exit-code 1 --no-progress --skip-version-check

  pypi:
    needs: [verify, build, image-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # GitHub attestations for `gh attestation verify` on the wheel and sdist; the upload
      # below adds PEP 740 attestations on PyPI's side.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - if: needs.verify.outputs.prerelease == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true
      - if: needs.verify.outputs.prerelease == 'false'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true

  github-release:
    needs: [verify, build, image, image-test, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lock
          path: lock/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          IMAGE: ghcr.io/${{ github.repository }}@${{ needs.image.outputs.digest }}
        run: |
          {
            echo "Image: \`$IMAGE\`"
            echo
            echo "Verify: \`gh attestation verify oci://$IMAGE --repo $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml --source-ref $GITHUB_REF --deny-self-hosted-runners\`"
            echo
            echo "Install from the hashed lock (\`requirements.lock\`), then the wheel; see docs/runbook.md. A plain \`pip install\` takes ranges, not the lock, and is not supported for production."
            echo
            echo "See CHANGELOG.md for changes and, under **Security**, what to check after upgrading."
          } > "$RUNNER_TEMP/notes.md"
          flag=()
          if [ "$PRERELEASE" = "true" ]; then flag=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" "${flag[@]}" \
            dist/* lock/requirements.lock lock/SHA256SUMS
