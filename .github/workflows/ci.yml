name: CI

# While the repository is private, Actions minutes are metered (2026-11-23): docs-only
# changes skip CI, and the matrix is cut to the oldest and newest Python. Put both back
# when it goes public (plan 8.3.1, repository settings). Docs a test reads still run CI
# (tests/test_ci_workflow.py checks the list against the tests).
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "!*.md"
      - "docs/design/mcp-server.md"
      - "docs/okta-setup.md"
      - "docs/runbook.md"
      - "README.md"
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "!*.md"
      - "docs/design/mcp-server.md"
      - "docs/okta-setup.md"
      - "docs/runbook.md"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.13 and 3.14 back with the full matrix when the repository is public.
        python-version: ["3.12", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: ${{ matrix.python-version }}
      - run: uv lock --check
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest
      - run: uv run pip-audit --skip-editable

  container:
    # Plans 7.1, 7.2: build the image, check how it runs, alone and from
    # docker/compose.example.yaml (tests/container), scan it.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.12"
      - run: docker build -t okta-mcp:ci .
      - run: uv sync --frozen
      - run: uv run pytest tests/container
        env:
          OKTA_MCP_IMAGE: okta-mcp:ci
      # BASE_IMAGE (design §11.2): the default's own digest, passed explicitly, builds an image
      # that passes the image tests; a tag fails the build at the digest check.
      - name: Build with BASE_IMAGE
        run: |
          base=$(sed -n 's/^FROM \(python:[^ ]*@sha256:[0-9a-f]\{64\}\) AS python-base$/\1/p' Dockerfile)
          test -n "$base"
          docker build --build-arg BASE_IMAGE="$base" -t okta-mcp:ci-base .
          if docker build --build-arg BASE_IMAGE=python:3.12-slim . > "$RUNNER_TEMP/tag.log" 2>&1; then
            echo "a tagged BASE_IMAGE built" >&2; exit 1
          fi
          grep -q "BASE_IMAGE must be pinned by digest" "$RUNNER_TEMP/tag.log"
      - run: uv run pytest tests/container/test_image.py
        env:
          OKTA_MCP_IMAGE: okta-mcp:ci-base
      # Trivy pinned by digest (Dependabot doesn't track images in run steps: bump by hand).
      # It reads a saved tarball, so it never gets the Docker socket.
      - name: Scan image
        run: |
          docker save okta-mcp:ci -o "$RUNNER_TEMP/image.tar"
          docker run --rm -v "$RUNNER_TEMP/image.tar:/image.tar:ro" \
            aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 \
            image --input /image.tar --scanners vuln --ignore-unfixed \
            --severity HIGH,CRITICAL --exit-code 1 --no-progress --skip-version-check
