# Live-org checks (plan 8.2.1): tests/live against the CI Okta org, with the CI service app.
#
# Never on pull_request: the job holds the CI service key, and a pull request's workflow file is
# the pull request's own. The key is an Environment secret on `okta-dev`, whose deployment
# branches are limited to main, so a workflow pushed on any other branch can't read it.
# A failure opens (or comments on) one issue; it does not gate merges, since Okta releases and
# org drift fail this as often as code does.
#
# Setup (by hand, once): the `okta-dev` environment with deployment branches `main` only, and
# five Environment *secrets* (not variables: GitHub prints variables in every log, and the org
# URL and client ID must not be public): OKTA_ORG_URL, OKTA_CLIENT_ID, OKTA_KEY_ID, OKTA_SCOPES
# from `terraform output github_environment_variables` (infra repo, okta-ci-org-terraform), and
# OKTA_PRIVATE_KEY, the CI service app's private key (PEM). Only the steps that use them get them.
name: live

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    # Only what the live run executes or reads: docs-only merges would spend the CI org's
    # rate limit and add noise to the failure issue. The nightly run still catches Okta drift.
    paths:
      - "src/**"
      - "tests/live/**"
      - "docker/policy.example.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/live.yml"

permissions:
  contents: read

concurrency:
  group: okta-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: okta-dev
    env:
      OKTA_LIVE: "1"
      # Low, so a looping test can't take much of the CI org's shared rate limit.
      MCP_REQUESTS_PER_MINUTE: "60"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.24"
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Write the service key
        env:
          KEY: ${{ secrets.OKTA_PRIVATE_KEY }}
        # Fail here, by name, rather than as one key-load error per test. Checks only that the
        # value is set and has a PEM private-key header; never prints any of it.
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Secret OKTA_PRIVATE_KEY is empty or not set on the okta-dev environment (Settings > Environments > okta-dev > Environment secrets)"
            exit 1
          fi
          case "$KEY" in
            *"-----BEGIN "*"PRIVATE KEY-----"*) ;;
            *)
              echo "::error::Secret OKTA_PRIVATE_KEY has no PEM private-key header: paste the whole PEM file, BEGIN and END lines included (not a JWK or a public key)"
              exit 1
              ;;
          esac
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/ci-service.pem"
          echo "OKTA_PRIVATE_KEY_FILE=$RUNNER_TEMP/ci-service.pem" >> "$GITHUB_ENV"
      - name: Live tests
        env:
          OKTA_ORG_URL: ${{ secrets.OKTA_ORG_URL }}
          OKTA_CLIENT_ID: ${{ secrets.OKTA_CLIENT_ID }}
          OKTA_KEY_ID: ${{ secrets.OKTA_KEY_ID }}
          OKTA_SCOPES: ${{ secrets.OKTA_SCOPES }}
          OKTA_LIVE_REPORT: ${{ runner.temp }}/commands.json
          OKTA_LIVE_REPORT_ROUTING: ${{ runner.temp }}/routing.json
        # --tb=line: pytest prints both sides of a failed assert; the tests assert only on
        # derived values, and this keeps a traceback's locals out of the log as well.
        # The org URL secret is masked only as written (with https://); mask the bare host too,
        # since connection errors name it without the scheme.
        run: |
          host="${OKTA_ORG_URL#*://}"
          host="${host%%/*}"
          if [ -n "$host" ]; then echo "::add-mask::$host"; fi
          uv run pytest tests/live --tb=line -p no:cacheprovider -rA
      - name: Summary
        if: always()
        # Command names, codes, counts and key names only (tests/live/test_commands.py).
        run: |
          for f in commands routing; do
            if [ -f "$RUNNER_TEMP/$f.json" ]; then
              { echo "### $f"; echo '```json'; cat "$RUNNER_TEMP/$f.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Remove the service key
        if: always()
        run: rm -f "$RUNNER_TEMP/ci-service.pem"

  signin:
    # Login-failure checks (tests/live/test_signin.py): signs the seeded test user in to fail
    # on purpose, then checks `diagnostics login-failures` names each cause. The only job that
    # changes anything in Okta (System Log events, a lockout the seeded policy undoes). After
    # `live`, so the two don't share the CI org's rate limit at once; whatever `live` ended with.
    needs: live
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: okta-dev
    env:
      OKTA_LIVE: "1"
      MCP_REQUESTS_PER_MINUTE: "60"
    steps:
      - name: Configured?
        id: setup
        env:
          PASSWORD: ${{ secrets.OKTA_LIVE_SIGNIN_PASSWORD }}
        # Until the sign-in seeds and their secret exist, say so and pass: the rest of the
        # live checks shouldn't go red for a part not set up yet. Never prints the value.
        run: |
          if [ -z "$PASSWORD" ]; then
            echo "::notice::Sign-in checks not configured: no OKTA_LIVE_SIGNIN_PASSWORD secret on okta-dev"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.setup.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.setup.outputs.enabled == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.24"
          python-version: "3.12"
      - if: steps.setup.outputs.enabled == 'true'
        run: uv sync --frozen
      - name: Write the service key
        if: steps.setup.outputs.enabled == 'true'
        env:
          KEY: ${{ secrets.OKTA_PRIVATE_KEY }}
        # As in `live`.
        run: |
          case "$KEY" in
            *"-----BEGIN "*"PRIVATE KEY-----"*) ;;
            *) echo "::error::Secret OKTA_PRIVATE_KEY is empty or not PEM"; exit 1 ;;
          esac
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/ci-service.pem"
          echo "OKTA_PRIVATE_KEY_FILE=$RUNNER_TEMP/ci-service.pem" >> "$GITHUB_ENV"
      - name: Sign-in checks
        if: steps.setup.outputs.enabled == 'true'
        env:
          OKTA_ORG_URL: ${{ secrets.OKTA_ORG_URL }}
          OKTA_CLIENT_ID: ${{ secrets.OKTA_CLIENT_ID }}
          OKTA_KEY_ID: ${{ secrets.OKTA_KEY_ID }}
          OKTA_SCOPES: ${{ secrets.OKTA_SCOPES }}
          OKTA_LIVE_SIGNIN_PASSWORD: ${{ secrets.OKTA_LIVE_SIGNIN_PASSWORD }}
        run: |
          host="${OKTA_ORG_URL#*://}"
          host="${host%%/*}"
          if [ -n "$host" ]; then echo "::add-mask::$host"; fi
          uv run pytest tests/live/test_signin.py --tb=line -p no:cacheprovider -rA
      - name: Remove the service key
        if: always()
        run: rm -f "$RUNNER_TEMP/ci-service.pem"

  report:
    # Its own job: it needs to write issues, and gets no environment, secret or checkout.
    needs: [live, signin]
    # Not only failure(): a run stopped by its timeout ends cancelled, and should open the
    # issue too.
    if: always() && (needs.live.result != 'success' || needs.signin.result != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Live-org checks failing"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          body="The live workflow failed: $RUN_URL"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
